XMLOutputCustom.category=Output
XMLOutputCustom.description=Write data to an XML file - custom
XMLOutputCustom.Injection.ADD_TO_RESULT=Enable this option to add the file name to the output data.
XMLOutputCustom.Injection.DATE_FORMAT=Specify the date time format.
XMLOutputCustom.Injection.DO_NOT_CREATE_FILE_AT_STARTUP=Enable this option to prevent empty files when no rows are processed.
XMLOutputCustom.Injection.ENCODING=Specify the encoding type for the XML file.
XMLOutputCustom.Injection.EXTENSION=This option adds the .xml extension to the file name.
XMLOutputCustom.Injection.FILENAME=The name of the XML file.
XMLOutputCustom.Injection.INC_DATE_IN_FILENAME=Enable this option to include the system date in the file name.
XMLOutputCustom.Injection.INC_TIME_IN_FILENAME=Enable this option to include the system time in the file name.
XMLOutputCustom.Injection.INC_TRANSFORMNR_IN_FILENAME=Enable this option to include the transform number in the output filenames.
XMLOutputCustom.Injection.MAIN_ELEMENT=The name of the root element in the XML document.
XMLOutputCustom.Injection.NAMESPACE=Specify the namespace for the XML file.
XMLOutputCustom.Injection.OMIT_NULL_VALUES=Enable this option if you want to leave null values out of the XML output.
XMLOutputCustom.Injection.OUTPUT_CONTENT_TYPE=Specify whether the XML field is an element or attribute.
XMLOutputCustom.Injection.OUTPUT_CURRENCY=Enter a symbol to represent the currency, for example $, \u20AC, or \u00A5.
XMLOutputCustom.Injection.OUTPUT_DECIMAL=Enter a symbol to represent a decimal, for example a period (.) or a comma (,).
XMLOutputCustom.Injection.OUTPUT_ELEMENTNAME=The name of the element in the XML file to use.
XMLOutputCustom.Injection.OUTPUT_FIELDNAME=The name of the field.
XMLOutputCustom.Injection.OUTPUT_FIELDS=The name of the output fields that are going into the XML file.
XMLOutputCustom.Injection.OUTPUT_FORMAT=Specify the format of the XML type used.
XMLOutputCustom.Injection.OUTPUT_GROUP=Enter a symbol to represent a grouping, for example a period (.) or a comma (,).
XMLOutputCustom.Injection.OUTPUT_LENGTH=Specify the length of the field type used.
XMLOutputCustom.Injection.OUTPUT_NULL=Specify the string to insert into the textfile if a value is null.
XMLOutputCustom.Injection.OUTPUT_PRECISION=Specify how many digits after a decimal will be used.
XMLOutputCustom.Injection.OUTPUT_TYPE=The format mask to convert the field. This can be a String, Date, Boolean, Integer, BigNumber, Binary, Timestamp, Internet Address.
XMLOutputCustom.Injection.PASS_TO_SERVLET=Enable this option to return the data through a web service instead of a file.
XMLOutputCustom.Injection.REPEAT_ELEMENT=The name of the row element to use in the XML document.
XMLOutputCustom.Injection.SPEFICY_FORMAT=Enable this option to specify the date time format.
XMLOutputCustom.Injection.SPLIT_EVERY=The maximum number of data to put in a single XML file before another is created.
XMLOutputCustom.Injection.ZIPPED=Enable this option if you want the XML file to be stored in a zip archive.
